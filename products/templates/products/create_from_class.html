{% extends "base.html" %}

{% block title %} Create Product{% endblock %}

{% block content %}
    <h1 class="text-center">{{ creador_producto }}</h1>

    <div class="col-12 col-md-6 mx-auto border p-4 rounded-3" style="background-color: #d1e7dd;">
        <p class="text-center fw-bold">Agrega un nuevo producto a tu inventario</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }} <!--TODO: mejorar los imputs y el diseño -->
            <button type="submit" class="btn btn-dark">Crear</button>
            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
