{% extends "base.html" %}

{% block title %}
    Register
{% endblock %}


{% block content %}
    <div class="col-12 col-md-6 mx-auto border p-4 rounded-3"style="background-color: #d1e7dd">
        <h1 class="display-5 fw-bold text-center">Registro de usuario</h1>
        <form action="" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario </label>
                <input
                    type="text"
                    name="username" 
                    id="username"
                    class="form-control"
                    placeholder="Escribe tu nombre de usuario"
                    aria-describedby="helpId"
                    required
                />
            </div>

            <div class="mb-3">
                <label for="password1" class="form-label">Contraseña</label>
                <input
                    type="password"
                    name="password1"
                    id="password1"
                    class="form-control"
                    placeholder="Escribe tu contraseña"
                    aria-describedby="helpId"
                    required
                />
            </div>

            <div class="mb-3">
                <label for="password2" class="form-label">Repita su contraseña</label>
                <input
                    type="password"
                    name="password2"
                    id="password2"
                    class="form-control"
                    placeholder="Escribe tu contraseña"
                    aria-describedby="helpId"
                    required
                />
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-control"
                    placeholder="Escribe tu email"
                    aria-describedby="helpId"
                />
            
            </div>
                <button type="submit" class="btn btn-dark">Registrar</button>
            </div>
        </form>
    </div>  

{% endblock %}
